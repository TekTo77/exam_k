services:
  postgres:
    image: postgres:16
    container_name: excel2pg-postgres
    restart: "no"
    environment:
      POSTGRES_DB: excel_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    # Учебная база очищается при остановке, перезапуске и удалении контейнера.
    tmpfs:
      - /var/lib/postgresql/data
